name: Build tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid xz

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: DimSlider-deb
          path: packages/*.deb
          if-no-files-found: error
